<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>
<script>
    let tasks = [];

function addTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();
  if (!text) return;

  tasks.push({ text, done: false });
  input.value = "";
 renderTasks();
}
function renderTasks(filter = "all") {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  const filtered = tasks.filter(task => {
    if (filter === "all") return true;
    if (filter === "done") return task.done;
    if (filter === "todo") return !task.done;
  });
}

</script>
<body>
    <div class="container">
    <h2>TodoInput</h2>
    <div class="input-area">
      <input id="taskInput" type="text" placeholder="Enter task..." />
      <button onclick="addTask()" >Add new task</button>
      <div class="progress-bar"></div>
    </div>
        <h2>Todo List</h2>
    <div class="tabs">
      <button onclick="filterTasks('all')">All</button>
      <button onclick="filterTasks('done')">Done</button>
      <button onclick="filterTasks('todo')">Todo</button>
    </div>
     <ul id="taskList"></ul>

    <div class="actions">
      <button onclick="deleteDoneTasks()" class="btn-small">Delete Done Tasks</button>
      <button onclick="deleteAllTasks()" class="btn-large">Delete All Tasks</button>
    </div>
  </div>
</body>
</html>
